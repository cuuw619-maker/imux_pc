name: Build Imux

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build Kotlin launcher
        run: gradle :launcher:test :launcher:installDist

      - name: Build C++ game
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64
          cmake --build build/native --config Release

      - name: Package Windows app
        shell: pwsh
        run: |
          $lib = (Resolve-Path "launcher/build/install/launcher/lib").Path
          $mainJar = Get-ChildItem $lib -Filter "*.jar" |
            Where-Object { $_.Name -eq "launcher.jar" -or $_.Name -like "launcher-*.jar" } |
            Select-Object -First 1

          if ($null -eq $mainJar) {
            throw "Launcher jar not found in $lib"
          }

          New-Item -ItemType Directory -Force -Path "build/package" | Out-Null

          jpackage \
            --type app-image \
            --name Imux \
            --app-version 0.0.1 \
            --input $lib \
            --main-jar $mainJar.Name \
            --main-class com.imux.launcher.MainKt \
            --dest "build/package"

          $app = "build/package/Imux"
          $game = "build/native/bin/ImuxGame.exe"

          if (!(Test-Path "$app/Imux.exe")) {
            throw "Launcher executable was not produced"
          }
          if (!(Test-Path $game)) {
            throw "Game executable was not produced"
          }

          Copy-Item $game "$app/ImuxGame.exe"

          New-Item -ItemType Directory -Force -Path "build/imux-windows-x64" | Out-Null
          Compress-Archive -Path "$app/*" -DestinationPath "build/imux-windows-x64/Imux-windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: imux-windows-x64
          retention-days: 14
          path: build/imux-windows-x64/Imux-windows-x64.zip
          if-no-files-found: error
