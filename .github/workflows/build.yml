name: Build Imux

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test
        run: gradle test
      - name: Build modules
        run: gradle build

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native launcher
        run: cmake -S . -B build/native -A x64
      - name: Build native launcher
        run: cmake --build build/native --config Release
      - name: Upload native launcher
        uses: actions/upload-artifact@v4
        with:
          name: imux-launcher-windows-x64
          path: |
            build/native/bin/ImuxLauncher.exe
            build/native/bin/imux_ui.hlsl
          if-no-files-found: error

  publish:
    needs: [native]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download native launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: imux-launcher-windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imux-build-${{ github.run_number }}"
          gh release create "$TAG"             release/ImuxLauncher.exe             release/imux_ui.hlsl             --repo "${{ github.repository }}"             --title "Imux Windows build ${{ github.run_number }}"             --prerelease             --target "${{ github.sha }}"             --notes "Automated Windows x64 build from commit ${{ github.sha }}."

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust workspace
        working-directory: rust
        run: cargo check --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: JVM tests
        run: gradle test
      - name: Build native launcher
        run: |
          cmake -S . -B build/native -A x64
          cmake --build build/native --config Release
      - name: Verify native executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/native/bin/ImuxLauncher.exe")) {
            throw "ImuxLauncher.exe was not produced"
          }
